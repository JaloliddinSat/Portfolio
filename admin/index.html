<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin | Jalol Satimov</title>
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if (localStorage.getItem("site-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch (_) {}
    </script>
    <link rel="stylesheet" href="/admin/styles.css?v=1" />
  </head>
  <body>
    <header class="admin-header">
      <a class="brand" href="/" aria-label="Back to portfolio">
        <span class="brand-mark">JS</span>
        <span>Portfolio</span>
      </a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.5" />
          <path d="M12 3v1.8M12 19.2V21M3 12h1.8M19.2 12H21M5.6 5.6l1.3 1.3M17.1 17.1l1.3 1.3M18.4 5.6l-1.3 1.3M6.9 17.1l-1.3 1.3" />
        </svg>
        <span data-theme-label>Light</span>
      </button>
    </header>

    <main class="admin-shell">
      <section class="auth-card" id="loading-view" aria-live="polite">
        <span class="eyebrow">Private access</span>
        <h1>Checking your session</h1>
        <p class="lede">One moment.</p>
      </section>

      <section class="auth-card" id="login-view" hidden>
        <span class="eyebrow">Portfolio admin</span>
        <h1>Welcome back.</h1>
        <p class="lede">Sign in to update the résumé shown on your portfolio.</p>

        <form id="login-form">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            value="jsatimov@uwaterloo.ca"
            autocomplete="username"
            required
          />

          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />

          <button class="primary-button" type="submit">Sign in</button>
          <p class="form-status" id="login-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="upload-card" id="upload-view" hidden>
        <div class="upload-heading">
          <div>
            <span class="eyebrow">Portfolio admin</span>
            <h1>Update résumé</h1>
            <p class="lede">Drop in a PDF to replace the résumé shown across the site.</p>
          </div>
          <button class="quiet-button" id="logout-button" type="button">Sign out</button>
        </div>

        <form id="upload-form">
          <label class="drop-zone" id="drop-zone" for="resume-file">
            <input id="resume-file" name="resume" type="file" accept="application/pdf,.pdf" />
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 16V4M7.5 8.5 12 4l4.5 4.5M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14" />
            </svg>
            <strong id="drop-title">Drop your résumé here</strong>
            <span id="drop-detail">or choose a PDF · up to 10 MB</span>
          </label>

          <div class="file-row" id="file-row" hidden>
            <div>
              <strong id="file-name"></strong>
              <span id="file-size"></span>
            </div>
            <button class="quiet-button" id="clear-file" type="button">Remove</button>
          </div>

          <div class="progress" id="progress" hidden aria-label="Upload progress">
            <span id="progress-bar"></span>
          </div>

          <button class="primary-button" id="upload-button" type="submit" disabled>
            Publish résumé
          </button>
          <p class="form-status" id="upload-status" role="status" aria-live="polite"></p>
        </form>

        <div class="current-file" id="current-file" hidden>
          <span>Currently published</span>
          <div>
            <strong>resume.pdf</strong>
            <span id="current-file-date"></span>
          </div>
          <a href="/resume/resume.pdf" target="_blank" rel="noopener noreferrer">View PDF</a>
        </div>
      </section>
    </main>

    <script src="/admin/admin.js?v=1" defer></script>
  </body>
</html>
