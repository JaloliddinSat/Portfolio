<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jalol Satimov — Email Signature</title>
  </head>
  <body style="margin:0; padding:24px; background-color:#ffffff;">
    <div style="margin-bottom:24px; font-family:Arial, Helvetica, sans-serif; font-size:14px; color:#222222;">
      <label for="signature-style">Signature style:</label>
      <select id="signature-style" style="margin-left:8px; padding:6px 10px; font:inherit;">
        <option value="picture">Picture</option>
        <option value="no-picture">No Picture</option>
      </select>
    </div>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; font-family:Arial, Helvetica, sans-serif; color:#222222;">
      <tr>
        <td id="signature-picture" style="padding:0 16px 0 0; vertical-align:middle;">
          <img src="https://jalolsatimov.com/profile.jpg" alt="Jalol Satimov" width="80" height="80" style="display:block; width:80px; height:80px; border:0; border-radius:50%; object-fit:cover;">
        </td>
        <td id="signature-details" style="padding:0 0 0 16px; border-left:1px solid #666666; vertical-align:middle;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; font-family:Arial, Helvetica, sans-serif;">
            <tr>
              <td style="padding:0 0 5px; color:#111111; font-size:16px; font-weight:bold; line-height:20px;">Jalol Satimov</td>
            </tr>
            <tr>
              <td style="padding:0 0 7px; color:#555555; font-size:12px; line-height:17px;">University of Waterloo</td>
            </tr>
            <tr>
              <td style="padding:0; font-size:12px; line-height:18px; white-space:nowrap;"><a href="https://www.linkedin.com/in/JalolSatimov" style="color:#333333; text-decoration:none;"><img src="https://jalolsatimov.com/assets/signature/linkedin.png?v=1" alt="" width="16" height="16" style="border:0; vertical-align:middle;">&nbsp;<span style="text-decoration:underline;">LinkedIn</span></a>&nbsp;&nbsp;&nbsp;<a href="https://jalolsatimov.com/" style="color:#333333; text-decoration:none;"><img src="https://jalolsatimov.com/assets/signature/portfolio.png?v=1" alt="" width="16" height="16" style="border:0; vertical-align:middle;">&nbsp;<span style="text-decoration:underline;">Portfolio</span></a>&nbsp;&nbsp;&nbsp;<a href="https://github.com/JaloliddinSat" style="color:#333333; text-decoration:none;"><img src="https://jalolsatimov.com/assets/signature/github.png?v=1" alt="" width="16" height="16" style="border:0; vertical-align:middle;">&nbsp;<span style="text-decoration:underline;">GitHub</span></a></td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
    <script>
      const signatureStyle = document.getElementById('signature-style');
      const signaturePicture = document.getElementById('signature-picture');
      const signatureDetails = document.getElementById('signature-details');
      const pictureDetailsStyle = signatureDetails.getAttribute('style');

      function updateSignature() {
        if (signatureStyle.value === 'no-picture') {
          signaturePicture.remove();
          signatureDetails.style.padding = '0';
          signatureDetails.style.borderLeft = 'none';
        } else {
          signatureDetails.before(signaturePicture);
          signatureDetails.setAttribute('style', pictureDetailsStyle);
        }
      }

      signatureStyle.addEventListener('change', updateSignature);
      updateSignature();
    </script>
  </body>
</html>
